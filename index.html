<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hypixel Skyblock Hub</title>
    <style>
        :root {
            --bg-dark: #0B0E14;
            --bg-card: #161C2A;
            --border-color: #2A364F;
            --text-main: #E2E8F0;
            --text-muted: #8E9BAE;
            --accent-gold: #F59E0B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .header {
            text-align: center;
            margin-bottom: 48px;
        }

        .header h1 {
            font-size: 2.5rem;
            color: #FFFFFF;
            margin-bottom: 8px;
        }

        .header h1 span {
            color: var(--accent-gold);
        }

        .header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            width: 100%;
            max-width: 900px;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .card:hover {
            transform: translateY(-6px);
            border-color: var(--accent-gold);
            box-shadow: 0 12px 30px rgba(245, 158, 11, 0.15);
        }

        .card-icon {
            font-size: 3rem;
            margin-bottom: 16px;
        }

        .card h2 {
            font-size: 1.5rem;
            color: var(--accent-gold);
            margin-bottom: 8px;
        }

        .card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .card.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Skyblock <span>Tools Hub</span></h1>
        <p>Select a database or tool below to get started</p>
    </div>

    <div class="grid-container">
        <!-- Odkaz na atributy -->
        <a href="attributes.html" class="card">
            <div class="card-icon">💎</div>
            <h2>Attributes</h2>
            <p>Interactive overview and complete database of all Skyblock attributes & shards.</p>
        </a>

        <!-- Připravovaná sekce pro Talismany -->
        <a href="talismans.html" class="card disabled">
            <div class="card-icon">📿</div>
            <h2>Talismans</h2>
            <p>Coming Soon... Accessory tracker & magical power guide.</p>
        </a>
    </div>
</body>
</html>
